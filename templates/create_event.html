
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Create Book Discussion Event</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/create_event.css') }}">
</head>

<body>
<button id="logout" name="logout"> LOGOUT</button>
<div class="container">

    <header class="page-header">
        <h1>Create an Event</h1>
        <p>Organize a new book discussion for the Leesclub community.</p>
    </header>
    
    <main class="event-content">

        <form action="/create_event"
              method="POST"
              enctype="multipart/form-data"
              id="create-form">

            <!-- BOOK DETAILS -->
            <div class="section">

                <h2>Book details</h2>
                <p class="section-description">
                    Tell participants which book will be discussed.
                </p>

                <div class="event-details">

                    <div class="image-upload">

                        <img
                            id="image-preview"
                            src="{{ url_for('static', filename='images/default-book.jpg') }}"
                            alt="Book cover preview"
                        >

                        <label for="image" class="upload-btn">
                            Choose book cover
                        </label>

                        <input
                            type="file"
                            id="image"
                            name="image"
                            accept="image/*"
                            hidden
                        >

                        <small>JPG, PNG or WEBP</small>

                    </div>

                    <div class="book-info">

                        <label for="book_title">Book title</label>

                        <input
                            type="text"
                            id="title"
                            name="title"
                            placeholder="Enter book title"
                            required
                        >

                        <label for="book_description">
                            Book description
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            rows="6"
                            placeholder="Write a short description of the book..."
                            required
                        ></textarea>

                    </div>

                </div>

            </div>


            <!-- EVENT INFORMATION -->
            <div class="information">

                <h2>Event information</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="date">Event date</label>

                        <input
                            type="date"
                            id="date"
                            name="date"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="time">Event time</label>

                        <input
                            type="time"
                            id="time"
                            name="time"
                            required
                        >
                    </div>

                    <div class="form-group full-width">
                        <label for="location">Location</label>

                        <input
                            type="text"
                            id="location"
                            name="location"
                            placeholder="Enter event location"
                            required
                        >
                    </div>

                </div>

            </div>


            <!-- REGISTRATION SETTINGS -->
            <div class="register">

                <h2>Registration settings</h2>

                <div class="form-group">
                    <label for="capacity">
                        Maximum number of participants
                    </label>

                    <input
                        type="number"
                        id="capacity"
                        name="capacity"
                        min="1"
                        placeholder="For example: 20"
                        required
                    >

                    <small>
                        Set the maximum number of people who can register.
                    </small>
                </div>

            </div>


            <!-- ACTIONS -->
            <div class="form-actions">

                

                
                <div id="submit-group">
                    <a href="/events" class="cancel-btn">
                    Cancel
                </a>
                        <button type="submit" class="btn" id="register-btn">
                    Create event
                </button>
                        <img src="" id="loading">
                        <div id="registering"></div>
                    </div>

            </div>

        </form>

    </main>

    <footer class="footer">
        Hosted by Leesclub
    </footer>

</div>

<script src="{{ url_for('static', filename='js/create_event.js') }}"></script>

</body>
</html>
